# Render Blueprint for DocPrático API
# Deploys the backend from the GitHub repo allandevbrazil/docfree (rootDir: backend)

services:
  - type: web
    name: docpratico-api
    runtime: node
    plan: free
    rootDir: backend
    region: oregon
    healthCheckPath: /health
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: API_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        sync: false